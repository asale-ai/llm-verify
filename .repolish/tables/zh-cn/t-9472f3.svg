<svg xmlns="http://www.w3.org/2000/svg" width="880" height="361" viewBox="0 0 880 361" lang="zh-CN" role="img" aria-label="能测什么 — table">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d56f4"/>
      <stop offset="0.55" stop-color="#ff5fd1"/>
      <stop offset="1" stop-color="#43e5d0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Noto Sans Mono CJK JP", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", monospace; }
  </style>
  <rect x="0" y="0" width="880" height="361" rx="18.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="879" height="360" rx="17.5" fill="none" stroke="#35334a"/>
  <text class="t" x="28" y="38" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">能测什么</text>
  <text class="t" x="28" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">组</text>
  <text class="t" x="150" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">回答的问题</text>
  <rect x="28" y="78" width="824" height="1" fill="#35334a"/>
  <text class="t" x="28" y="102" font-size="13" fill="#edebfa" text-anchor="start">协议契约</text>
  <text class="t" x="150" y="102" font-size="13" fill="#edebfa" text-anchor="start">这是不是一条正牌 API 通道</text>
  <rect x="20" y="113" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="137" font-size="13" fill="#edebfa" text-anchor="start">流式传输</text>
  <text class="t" x="150" y="137" font-size="13" fill="#edebfa" text-anchor="start">流式响应是否规范，有没有空 body</text>
  <text class="t" x="28" y="172" font-size="13" fill="#edebfa" text-anchor="start">计量计费</text>
  <text class="t" x="150" y="172" font-size="13" fill="#edebfa" text-anchor="start">计费数字可信吗，有没有多收钱</text>
  <rect x="20" y="183" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="207" font-size="13" fill="#edebfa" text-anchor="start">渠道溯源</text>
  <text class="t" x="150" y="207" font-size="13" fill="#edebfa" text-anchor="start">这条链路上有哪些中转</text>
  <text class="t" x="28" y="242" font-size="13" fill="#edebfa" text-anchor="start">性能速度</text>
  <text class="t" x="150" y="242" font-size="13" fill="#edebfa" text-anchor="start">首字延迟、吞吐与抖动</text>
  <rect x="20" y="253" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="277" font-size="13" fill="#edebfa" text-anchor="start">模型身份</text>
  <text class="t" x="150" y="277" font-size="13" fill="#edebfa" text-anchor="start">背后跑的是不是它声称的那个模型</text>
  <text class="t" x="28" y="312" font-size="13" fill="#edebfa" text-anchor="start">跨请求一致性</text>
  <text class="t" x="150" y="312" font-size="13" fill="#edebfa" text-anchor="start">多次请求的行为是否一致</text>
  <rect x="28" y="323" width="824" height="1" fill="#35334a"/>
</svg>
