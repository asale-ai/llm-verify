<svg xmlns="http://www.w3.org/2000/svg" width="880" height="467" viewBox="0 0 880 467" lang="zh-CN" role="img" aria-label="常用参数 — table">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d56f4"/>
      <stop offset="0.55" stop-color="#ff5fd1"/>
      <stop offset="1" stop-color="#43e5d0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Noto Sans Mono CJK JP", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", monospace; }
  </style>
  <rect x="0" y="0" width="880" height="467" rx="18.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="879" height="466" rx="17.5" fill="none" stroke="#35334a"/>
  <text class="t" x="28" y="38" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">常用参数</text>
  <text class="t" x="28" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">参数</text>
  <text class="t" x="284" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">说明</text>
  <rect x="28" y="78" width="824" height="1" fill="#35334a"/>
  <rect x="28" y="89" width="206" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="102" font-size="12" fill="#edebfa" text-anchor="start">--protocol anthropic|openai</text>
  <text class="t" x="284" y="102" font-size="13" fill="#edebfa" text-anchor="start">不填会根据 URL 与模型名自动推断</text>
  <rect x="20" y="113" width="840" height="35" rx="5.0" fill="#222130"/>
  <rect x="28" y="124" width="228" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="137" font-size="12" fill="#edebfa" text-anchor="start">--depth fast|balanced|forensic</text>
  <text class="t" x="284" y="137" font-size="13" fill="#edebfa" text-anchor="start">默认 balanced。forensic 采样更多、更慢更贵，但结论更硬</text>
  <rect x="28" y="159" width="62" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="172" font-size="12" fill="#edebfa" text-anchor="start">--turbo</text>
  <text class="t" x="284" y="172" font-size="13" fill="#edebfa" text-anchor="start">还能给出结论的最快跑法：9 次请求而不是 21</text>
  <text class="t" x="284" y="190" font-size="13" fill="#edebfa" text-anchor="start">次，且并发发出。代价是放弃佐证性的身份探针，以及用来识别「网页会话重建…</text>
  <rect x="20" y="201" width="840" height="53" rx="5.0" fill="#222130"/>
  <rect x="28" y="212" width="120" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="225" font-size="12" fill="#edebfa" text-anchor="start">--concurrency N</text>
  <text class="t" x="284" y="225" font-size="13" fill="#edebfa" text-anchor="start">同时在途的请求数，默认 1。只在你确知对面能同时应答这么多时才调高 ——</text>
  <text class="t" x="284" y="243" font-size="13" fill="#edebfa" text-anchor="start">延迟类探针任何时候都独占运行</text>
  <rect x="28" y="265" width="156" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="278" font-size="12" fill="#edebfa" text-anchor="start">--claimed-model &lt;ID&gt;</text>
  <text class="t" x="284" y="278" font-size="13" fill="#edebfa" text-anchor="start">供应商宣称的模型名与实际请求的不同时用——查降级就靠它</text>
  <rect x="20" y="289" width="840" height="35" rx="5.0" fill="#222130"/>
  <rect x="28" y="300" width="98" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="313" font-size="12" fill="#edebfa" text-anchor="start">--lang en|zh</text>
  <text class="t" x="284" y="313" font-size="13" fill="#edebfa" text-anchor="start">报告语言。默认跟随系统 locale，识别不出则用英文</text>
  <rect x="28" y="335" width="77" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="348" font-size="12" fill="#edebfa" text-anchor="start">-o &lt;path&gt;</text>
  <text class="t" x="284" y="348" font-size="13" fill="#edebfa" text-anchor="start">HTML 报告路径，传目录则自动命名</text>
  <rect x="20" y="359" width="840" height="35" rx="5.0" fill="#222130"/>
  <rect x="28" y="370" width="106" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="383" font-size="12" fill="#edebfa" text-anchor="start">--json &lt;path&gt;</text>
  <text class="t" x="284" y="383" font-size="13" fill="#edebfa" text-anchor="start">同时输出机器可读的 JSON</text>
  <rect x="28" y="405" width="77" height="19" rx="4.0" fill="#222130"/>
  <text class="t" x="34" y="418" font-size="12" fill="#edebfa" text-anchor="start">--no-open</text>
  <text class="t" x="284" y="418" font-size="13" fill="#edebfa" text-anchor="start">不自动打开浏览器</text>
  <rect x="28" y="429" width="824" height="1" fill="#35334a"/>
</svg>
