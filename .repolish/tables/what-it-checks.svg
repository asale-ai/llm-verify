<svg xmlns="http://www.w3.org/2000/svg" width="880" height="361" viewBox="0 0 880 361" lang="en" role="img" aria-label="What it checks — table">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d56f4"/>
      <stop offset="0.55" stop-color="#ff5fd1"/>
      <stop offset="1" stop-color="#43e5d0"/>
    </linearGradient>
  </defs>
  <style>
    .t { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", "Noto Sans Mono CJK SC", "Noto Sans Mono CJK JP", "Microsoft YaHei", "Hiragino Sans", "Yu Gothic", monospace; }
  </style>
  <rect x="0" y="0" width="880" height="361" rx="18.0" fill="#1a1a24"/>
  <rect x="0.5" y="0.5" width="879" height="360" rx="17.5" fill="none" stroke="#35334a"/>
  <text class="t" x="28" y="38" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">WHAT IT CHECKS</text>
  <text class="t" x="28" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">GROUP</text>
  <text class="t" x="251" y="68" font-size="11" fill="#8b87a3" text-anchor="start" letter-spacing="1.4">QUESTION IT ANSWERS</text>
  <rect x="28" y="78" width="824" height="1" fill="#35334a"/>
  <text class="t" x="28" y="102" font-size="13" fill="#edebfa" text-anchor="start">Protocol contract</text>
  <text class="t" x="251" y="102" font-size="13" fill="#edebfa" text-anchor="start">Is this a genuine API channel?</text>
  <rect x="20" y="113" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="137" font-size="13" fill="#edebfa" text-anchor="start">Streaming</text>
  <text class="t" x="251" y="137" font-size="13" fill="#edebfa" text-anchor="start">Does streaming follow the protocol, or arrive empty?</text>
  <text class="t" x="28" y="172" font-size="13" fill="#edebfa" text-anchor="start">Metering &amp; billing</text>
  <text class="t" x="251" y="172" font-size="13" fill="#edebfa" text-anchor="start">Are the token counts honest, or are you overcharged?</text>
  <rect x="20" y="183" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="207" font-size="13" fill="#edebfa" text-anchor="start">Channel provenance</text>
  <text class="t" x="251" y="207" font-size="13" fill="#edebfa" text-anchor="start">What relays sit on this path?</text>
  <text class="t" x="28" y="242" font-size="13" fill="#edebfa" text-anchor="start">Performance</text>
  <text class="t" x="251" y="242" font-size="13" fill="#edebfa" text-anchor="start">First-token latency, throughput and jitter</text>
  <rect x="20" y="253" width="840" height="35" rx="5.0" fill="#222130"/>
  <text class="t" x="28" y="277" font-size="13" fill="#edebfa" text-anchor="start">Model identity</text>
  <text class="t" x="251" y="277" font-size="13" fill="#edebfa" text-anchor="start">Is the model behind this the one that was sold?</text>
  <text class="t" x="28" y="312" font-size="13" fill="#edebfa" text-anchor="start">Cross-request consistency</text>
  <text class="t" x="251" y="312" font-size="13" fill="#edebfa" text-anchor="start">Does the endpoint behave the same way every time?</text>
  <rect x="28" y="323" width="824" height="1" fill="#35334a"/>
</svg>
